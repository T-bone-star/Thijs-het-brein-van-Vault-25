<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riool Kaart – D&D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0f; color: #c8a96e; font-family: 'Georgia', serif; overflow: hidden; }
  #ui { position: fixed; top: 10px; right: 10px; background: rgba(10,10,20,0.92); border: 1px solid #3a2a10; padding: 12px; width: 220px; border-radius: 4px; z-index: 10; }
  #ui h2 { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #e8c070; margin-bottom: 10px; border-bottom: 1px solid #3a2a10; padding-bottom: 6px; }
  .gate-row { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; }
  .gate-row label { font-size: 12px; }
  .toggle { cursor: pointer; width: 42px; height: 22px; background: #1a1a2e; border: 1px solid #3a2a10; border-radius: 11px; position: relative; transition: background 0.3s; }
  .toggle.open { background: #1a4a2e; border-color: #2a8a4a; }
  .toggle::after { content:''; position:absolute; top:3px; left:3px; width:14px; height:14px; background:#5a3a10; border-radius:50%; transition: left 0.3s, background 0.3s; }
  .toggle.open::after { left:23px; background:#2ada6a; }
  #water-info { margin-top: 10px; font-size: 12px; }
  #water-bar-bg { background: #111; border: 1px solid #3a2a10; height: 10px; border-radius: 5px; margin-top: 4px; overflow: hidden; }
  #water-bar { height: 100%; background: linear-gradient(90deg, #1a4a7a, #2a8aca); width: 0%; transition: width 1s; border-radius: 5px; }
  #room-label { margin-top: 8px; font-size: 12px; color: #e8c070; min-height: 16px; }
  canvas { display: block; }
  .btn { margin-top: 8px; width: 100%; padding: 5px; background: #1a0a00; border: 1px solid #5a3a10; color: #c8a96e; cursor: pointer; font-family: Georgia, serif; font-size: 12px; border-radius: 3px; }
  .btn:hover { background: #2a1a00; }
  #player-badge { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(10,10,20,0.85); border: 1px solid #2a5a8a; padding: 5px 16px; border-radius: 4px; font-size: 11px; letter-spacing: 3px; color: #4a8aca; z-index: 10; display: none; text-transform: uppercase; }
  #hint { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(10,10,20,0.7); border: 1px solid #3a2a10; padding: 4px 12px; border-radius: 3px; font-size: 10px; color: #666; z-index: 10; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <h2>⚙ DM Paneel</h2>
  <div style="font-size:10px;color:#555;margin-bottom:8px;line-height:1.5">
    Klik → spotlight<br>
    Dubbelklik kamer → inzoomen<br>
    Dubbelklik leeg / Esc → uitzoomen
  </div>

  <div style="border-top:1px solid #3a2a10;padding-top:8px;margin-top:2px">
    <div style="font-size:10px;color:#888;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px">Sluisdeuren</div>
    <div class="gate-row"><label>Sluis A (Gang 1)</label><div class="toggle" id="gA" onclick="toggleGate('A')"></div></div>
    <div class="gate-row"><label>Sluis B (Gang 2)</label><div class="toggle" id="gB" onclick="toggleGate('B')"></div></div>
    <div class="gate-row"><label>Sluis C (Zijkamer)</label><div class="toggle" id="gC" onclick="toggleGate('C')"></div></div>
    <div class="gate-row"><label>Sluis D (Grote Hal)</label><div class="toggle" id="gD" onclick="toggleGate('D')"></div></div>
  </div>

  <div id="water-info">
    <span>Waterpeil: <span id="water-pct">0</span>%</span>
    <div id="water-bar-bg"><div id="water-bar"></div></div>
  </div>

  <div id="room-label"></div>

  <button class="btn" onclick="zoomOut()" style="border-color:#3a5a20;margin-top:10px">Uitzoomen (Esc)</button>
  <button class="btn" onclick="resetAll()">Alles resetten</button>
  <button class="btn" onclick="openPlayerScreen()" style="border-color:#2a5a8a;margin-top:8px">&#128TV; Open Spelers Scherm</button>
</div>

<div id="player-badge">Spelers Scherm</div>
<div id="hint"></div>

<script>
// ── World constants ──────────────────────────────────────────────
const WW = 1600, WH = 900;

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;

// ── Mode ─────────────────────────────────────────────────────────
const isDM = !location.search.includes('mode=player');
const channel = new BroadcastChannel('sewer-map-sync');

// ── Camera ───────────────────────────────────────────────────────
let cam    = { x: WW/2, y: WH/2, z: 1 };
let camTgt = { x: WW/2, y: WH/2, z: 1 };

function fitZoom() { return Math.min(W/WW, H/WH) * 0.97; }

function initCamera() {
  const z = fitZoom();
  cam    = { x: WW/2, y: WH/2, z };
  camTgt = { x: WW/2, y: WH/2, z };
}

function applyCamera() {
  ctx.setTransform(cam.z, 0, 0, cam.z, W/2 - cam.x*cam.z, H/2 - cam.y*cam.z);
}

function w2s(wx, wy) {
  return { x: (wx - cam.x)*cam.z + W/2, y: (wy - cam.y)*cam.z + H/2 };
}

function s2w(sx, sy) {
  return { x: (sx - W/2)/cam.z + cam.x, y: (sy - H/2)/cam.z + cam.y };
}

function zoomToRoom(room) {
  const cx = room.x + room.w/2, cy = room.y + room.h/2;
  const z  = Math.min(W/(room.w*1.35), H/(room.h*1.35), fitZoom()*5);
  camTgt   = { x: cx, y: cy, z };
  broadcast();
}

function zoomOut() {
  camTgt = { x: WW/2, y: WH/2, z: fitZoom() };
  broadcast();
}

// ── State ────────────────────────────────────────────────────────
const gates = { A:false, B:false, C:false, D:false };
let waterLevel = 0, waterTgt = 0;
let spotW = null;      // world coords target
let spotC = null;      // world coords animated current

// ── Broadcast ────────────────────────────────────────────────────
function broadcast() {
  if (!isDM) return;
  channel.postMessage({
    cam: { ...camTgt },
    gates: { ...gates },
    waterTgt,
    spot: spotW ? { ...spotW } : null
  });
}

if (!isDM) {
  document.getElementById('ui').style.display   = 'none';
  document.getElementById('player-badge').style.display = 'block';
  document.getElementById('hint').textContent   = 'Wacht op DM…';
  canvas.style.cursor = 'default';

  channel.onmessage = ({ data: d }) => {
    camTgt   = d.cam;
    waterTgt = d.waterTgt;
    Object.assign(gates, d.gates);
    spotW = d.spot;
    if (!spotC && d.spot) spotC = { ...d.spot };
    document.getElementById('hint').textContent = '';
  };
} else {
  canvas.style.cursor = 'crosshair';
  document.getElementById('hint').textContent   = 'Klik = spotlight · Dubbelklik kamer = inzoomen · Esc = uitzoomen';
}

// ── Gate / water ─────────────────────────────────────────────────
function toggleGate(id) {
  gates[id] = !gates[id];
  document.getElementById('g'+id).classList.toggle('open', gates[id]);
  waterTgt = Object.values(gates).filter(Boolean).length / 4;
  broadcast();
}

function resetAll() {
  ['A','B','C','D'].forEach(id => { gates[id]=false; document.getElementById('g'+id).classList.remove('open'); });
  waterTgt = 0;
  spotW = null; spotC = null;
  document.getElementById('room-label').textContent = '';
  zoomOut();
}

function openPlayerScreen() {
  window.open(location.pathname + '?mode=player', '_blank');
}

// ── Layout (fixed world coords) ──────────────────────────────────
const MX = WW*0.05, MY = WH*0.05, MW = WW*0.82, MH = WH*0.88;

const ROOMS = [
  { id:'R1',   x:MX+MW*0.05, y:MY+MH*0.05, w:MW*0.22, h:MH*0.28, label:'Ruimte 1\n(Pompkamer)',      bw:0.08 },
  { id:'R2',   x:MX+MW*0.73, y:MY+MH*0.05, w:MW*0.22, h:MH*0.28, label:'Ruimte 2\n(Filterput)',      bw:0.08 },
  { id:'R3',   x:MX+MW*0.05, y:MY+MH*0.45, w:MW*0.22, h:MH*0.28, label:'Ruimte 3\n(Opslagkuil)',     bw:0.12 },
  { id:'R4',   x:MX+MW*0.73, y:MY+MH*0.45, w:MW*0.22, h:MH*0.28, label:'Ruimte 4\n(Overloopkamer)',  bw:0.12 },
  { id:'HALL', x:MX+MW*0.28, y:MY+MH*0.58, w:MW*0.44, h:MH*0.37, label:'Grote Hal\n(Vergaarbekken)', bw:0.20 }
];

const CORRIDORS = [
  { x1f:0.27, y1f:0.19, x2f:0.73, y2f:0.19, wf:0.055, gate:'A' },
  { x1f:0.27, y1f:0.59, x2f:0.50, y2f:0.59, wf:0.055, gate:'B' },
  { x1f:0.73, y1f:0.59, x2f:0.50, y2f:0.59, wf:0.055, gate:'C' },
  { x1f:0.16, y1f:0.33, x2f:0.16, y2f:0.45, wf:0.055, gate:null },
  { x1f:0.84, y1f:0.33, x2f:0.84, y2f:0.45, wf:0.055, gate:null },
  { x1f:0.50, y1f:0.745,x2f:0.50, y2f:0.82, wf:0.10,  gate:'D' },
];

function roomAt(wx, wy) {
  return ROOMS.find(r => wx>=r.x && wx<=r.x+r.w && wy>=r.y && wy<=r.y+r.h) || null;
}

// ── Input (DM only) ──────────────────────────────────────────────
let clickTimer = null;
canvas.addEventListener('click', e => {
  if (!isDM) return;
  const rect = canvas.getBoundingClientRect();
  const wp   = s2w(e.clientX-rect.left, e.clientY-rect.top);

  clearTimeout(clickTimer);
  clickTimer = setTimeout(() => {
    // Single click → spotlight
    spotW = wp;
    if (!spotC) spotC = { ...wp };
    const room = roomAt(wp.x, wp.y);
    document.getElementById('room-label').textContent = room ? room.label.replace('\n',' – ') : '';
    broadcast();
  }, 220);
});

canvas.addEventListener('dblclick', e => {
  if (!isDM) return;
  clearTimeout(clickTimer);
  const rect = canvas.getBoundingClientRect();
  const wp   = s2w(e.clientX-rect.left, e.clientY-rect.top);
  const room = roomAt(wp.x, wp.y);
  if (room) {
    zoomToRoom(room);
    document.getElementById('room-label').textContent = room.label.replace('\n',' – ');
  } else {
    zoomOut();
    document.getElementById('room-label').textContent = '';
  }
});

document.addEventListener('keydown', e => { if (e.key==='Escape' && isDM) zoomOut(); });

// ── Draw helpers ─────────────────────────────────────────────────
function drawGrid() {
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.strokeStyle = '#c8a020';
  ctx.lineWidth   = 0.5;
  for (let x=0; x<=WW; x+=40) { ctx.beginPath(); ctx.moveTo(x,0);  ctx.lineTo(x,WH);  ctx.stroke(); }
  for (let y=0; y<=WH; y+=40) { ctx.beginPath(); ctx.moveTo(0,y);  ctx.lineTo(WW,y);  ctx.stroke(); }
  ctx.restore();
}

function drawStone(x, y, w, h) {
  ctx.save();
  ctx.fillStyle = '#161220';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#3a2a15';
  ctx.lineWidth   = 0.5;
  ctx.globalAlpha = 0.25;
  const bH=18, bW=36;
  for (let row=0; row*bH<h; row++) {
    const ox = (row%2)*(bW/2);
    for (let col=-1; col*bW<w+bW; col++)
      ctx.strokeRect(x+col*bW+ox, y+row*bH, bW, bH);
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#3a2a15';
  ctx.lineWidth   = 2;
  ctx.strokeRect(x, y, w, h);
  ctx.restore();
}

function drawWater(x, y, w, h, level, t) {
  if (level <= 0) return;
  const wH = h * level, wy = y+h-wH;
  ctx.save();
  ctx.globalAlpha = 0.72;
  const g = ctx.createLinearGradient(x, wy, x, y+h);
  g.addColorStop(0, '#1a5a9a'); g.addColorStop(1, '#0a2a4a');
  ctx.fillStyle = g;
  ctx.fillRect(x, wy, w, wH);
  ctx.globalAlpha = 0.25;
  ctx.strokeStyle = '#4acaff';
  ctx.lineWidth = 1;
  for (let i=1; i<=3; i++) {
    const ry = wy + (wH/4)*i;
    ctx.beginPath();
    for (let xi=x; xi<x+w; xi+=8) {
      const v = Math.sin(xi*0.05 + t*0.001*i)*1.5;
      xi===x ? ctx.moveTo(xi,ry+v) : ctx.lineTo(xi,ry+v);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawGate(x, y, vert, open) {
  const gw=vert?6:24, gh=vert?24:6;
  const ox=open?(vert?0:gw*1.5):0, oy=open?(vert?gh*1.5:0):0;
  ctx.save();
  if (open) ctx.globalAlpha = 0.5;
  ctx.fillStyle   = open ? '#2a8a4a' : '#8a2a10';
  ctx.strokeStyle = open ? '#4ada7a' : '#da5a30';
  ctx.lineWidth   = 1.5;
  ctx.fillRect  (x-gw/2+ox, y-gh/2+oy, gw, gh);
  ctx.strokeRect(x-gw/2+ox, y-gh/2+oy, gw, gh);
  ctx.restore();
}

function drawCorridor(c, t) {
  const x1=MX+MW*c.x1f, y1=MY+MH*c.y1f, x2=MX+MW*c.x2f, y2=MY+MH*c.y2f;
  const cw=MW*c.wf;
  const dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy);
  const nx=-dy/len, ny=dx/len;
  ctx.save();
  ctx.fillStyle   = '#1a1520';
  ctx.strokeStyle = '#3a2a15';
  ctx.lineWidth   = 2;
  ctx.beginPath();
  ctx.moveTo(x1+nx*cw/2, y1+ny*cw/2);
  ctx.lineTo(x2+nx*cw/2, y2+ny*cw/2);
  ctx.lineTo(x2-nx*cw/2, y2-ny*cw/2);
  ctx.lineTo(x1-nx*cw/2, y1-ny*cw/2);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  const wl = Math.min(waterLevel*0.6, 0.8);
  if (wl > 0) {
    const wh = cw*wl;
    ctx.globalAlpha = 0.65;
    ctx.fillStyle   = '#1a5a9a';
    ctx.beginPath();
    ctx.moveTo(x1+nx*(cw/2-wh), y1+ny*(cw/2-wh));
    ctx.lineTo(x2+nx*(cw/2-wh), y2+ny*(cw/2-wh));
    ctx.lineTo(x2-nx*cw/2,      y2-ny*cw/2);
    ctx.lineTo(x1-nx*cw/2,      y1-ny*cw/2);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }

  if (c.gate) {
    const gx=(x1+x2)/2, gy=(y1+y2)/2;
    const vert = Math.abs(dy)>Math.abs(dx);
    drawGate(gx, gy, vert, gates[c.gate]);
    ctx.fillStyle   = '#c8a96e';
    ctx.font        = '10px Georgia';
    ctx.textAlign   = 'center';
    ctx.fillText('Sluis '+c.gate, gx+(vert?20:0), gy+(vert?0:-14));
  }
  ctx.restore();
}

function drawRoom(r, t) {
  const wl = Math.min(waterLevel*r.bw*5, 0.85);
  drawStone(r.x, r.y, r.w, r.h);
  drawWater(r.x+2, r.y+2, r.w-4, r.h-4, wl, t);
  ctx.save();
  ctx.fillStyle  = '#c8a96e';
  ctx.font       = r.id==='HALL' ? 'bold 13px Georgia' : '11px Georgia';
  ctx.textAlign  = 'center';
  ctx.globalAlpha= 0.85;
  r.label.split('\n').forEach((l,i) => ctx.fillText(l, r.x+r.w/2, r.y+20+i*15));
  ctx.restore();
  if (r.id!=='HALL') drawTorch(r.x+10, r.y+10, t);
}

function drawTorch(x, y, t) {
  ctx.save();
  ctx.strokeStyle = '#e8a020'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+10); ctx.stroke();
  ctx.fillStyle = `rgba(255,180,30,${0.6+0.4*Math.sin(t*0.005)})`;
  ctx.beginPath(); ctx.arc(x, y-2, 3+Math.sin(t*0.007), 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawSpotlight(sx, sy) {
  const r = Math.min(W,H)*0.18;
  ctx.save();
  let g = ctx.createRadialGradient(sx,sy,0, sx,sy,r);
  g.addColorStop(0,   'rgba(255,230,150,0.18)');
  g.addColorStop(0.4, 'rgba(255,210,100,0.06)');
  g.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(255,220,120,0.3)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(sx,sy,r*0.38,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

function drawDark(sx, sy) {
  const r = Math.min(W,H)*0.18;
  ctx.save();
  let g = ctx.createRadialGradient(sx,sy,r*0.4, sx,sy,r*1.4);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,0.82)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.restore();
}

function drawCompass() {
  const cx=50, cy=H-50, r=28;
  ctx.save();
  ctx.strokeStyle='#5a4020'; ctx.fillStyle='#0a0a10'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#c8a96e'; ctx.font='bold 10px Georgia'; ctx.textAlign='center';
  ctx.fillText('N',cx,cy-r+13); ctx.fillText('Z',cx,cy+r-4);
  ctx.fillText('W',cx-r+7,cy+4); ctx.fillText('O',cx+r-7,cy+4);
  ctx.strokeStyle='#da5a30'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx,cy-r+16); ctx.lineTo(cx,cy); ctx.stroke();
  ctx.strokeStyle='#888'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx,cy+r-8); ctx.stroke();
  ctx.restore();
}

function drawLegend() {
  const lx=10, ly=H-195;
  ctx.save();
  ctx.fillStyle='rgba(10,10,20,0.85)'; ctx.strokeStyle='#3a2a10'; ctx.lineWidth=1;
  ctx.fillRect(lx,ly,130,88); ctx.strokeRect(lx,ly,130,88);
  ctx.font='10px Georgia'; ctx.textAlign='left';
  const rows=[['#8a2a10','Gesloten sluis'],['#2a8a4a','Open sluis'],['#1a5a9a','Water'],['#161220','Steen muur']];
  rows.forEach(([col,lbl],i)=>{
    ctx.fillStyle=col; ctx.fillRect(lx+8,ly+12+i*18,16,8);
    if(col==='#161220'){ctx.strokeStyle='#3a2a15';ctx.strokeRect(lx+8,ly+12+i*18,16,8);}
    ctx.fillStyle='#c8a96e'; ctx.fillText(lbl,lx+30,ly+19+i*18);
  });
  ctx.restore();
}

// ── Main loop ────────────────────────────────────────────────────
let lastT = 0;
function draw(ts) {
  requestAnimationFrame(draw);
  if (ts - lastT < 33) return;
  lastT = ts;

  // Water animation
  waterLevel += (waterTgt - waterLevel) * 0.04;
  if (isDM) {
    document.getElementById('water-bar').style.width = (waterLevel*100).toFixed(1)+'%';
    document.getElementById('water-pct').textContent = Math.round(waterLevel*100);
  }

  // Camera animation
  const e = 0.07;
  cam.x += (camTgt.x - cam.x)*e;
  cam.y += (camTgt.y - cam.y)*e;
  cam.z += (camTgt.z - cam.z)*e;

  // Spotlight animation (world coords)
  if (spotW) {
    if (!spotC) spotC = { ...spotW };
    spotC.x += (spotW.x - spotC.x)*0.08;
    spotC.y += (spotW.y - spotC.y)*0.08;
  }

  // Background
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#080810';
  ctx.fillRect(0,0,W,H);

  // ── World space ──
  ctx.save();
  applyCamera();

  drawGrid();
  CORRIDORS.forEach(c => drawCorridor(c, ts));
  ROOMS.forEach(r => drawRoom(r, ts));

  ctx.restore();

  // ── Screen space overlays ──
  if (spotC) {
    const sp = w2s(spotC.x, spotC.y);
    drawSpotlight(sp.x, sp.y);
    drawDark(sp.x, sp.y);
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0,0,W,H);
  }

  drawCompass();
  drawLegend();

  ctx.save();
  ctx.fillStyle='#c8a96e'; ctx.font='bold 17px Georgia'; ctx.textAlign='left'; ctx.globalAlpha=0.8;
  ctx.fillText('Vault-25 – Rioolsysteem', 10, 26);
  ctx.restore();
}

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initCamera();
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
